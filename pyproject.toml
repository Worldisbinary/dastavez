[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dastavez"
version = "0.1.0"
description = "Citation-verified RAG over Indian government scheme documents, with a routed OCR cascade for Devanagari and scanned pages."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aman Arora" }]
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pillow>=10.0",
  "numpy>=1.26",
  "rapidfuzz>=3.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
ml = ["fastembed>=0.5"]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.6", "pytesseract>=0.3.10"]
all = ["dastavez[ocr,ml,pg,dev]"]

[project.scripts]
dastavez = "dastavez.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dastavez = ["web/*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Devanagari and typographic characters are intentional
  "E501",  # line length is enforced by `ruff format`; long string literals are left intact
  "SIM905",  # whitespace-separated stopword lists are easier to read than list literals
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ocr: requires the tesseract binary with eng+hin traineddata",
  "pg: requires DASTAVEZ_DATABASE_URL pointing at Postgres with pgvector",
  "corpus: requires the downloaded corpus PDFs",
]
filterwarnings = ["ignore::DeprecationWarning"]
