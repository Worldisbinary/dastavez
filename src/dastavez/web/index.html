<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dastavez</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e2dc; --accent:#1f5f8b; --warn:#9a5b00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe6; --muted:#a3a29b; --card:#1f1f1d; --line:#33332f; --accent:#7db7e0; --warn:#e2a54a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, "Noto Sans", "Noto Sans Devanagari", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; } p.sub { color: var(--muted); margin: 0 0 24px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font-size:1rem; }
  select, button { padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font-size:.95rem; }
  button { background: var(--accent); color: #fff; border: 0; cursor: pointer; }
  .answer { margin-top:24px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .s { margin: 0 0 10px; } .cite { font-size:.8rem; color:var(--accent); cursor:pointer; white-space:nowrap; border-bottom:1px dotted; }
  .snip { display:none; margin:6px 0 12px; padding:10px 12px; border-left:3px solid var(--accent); background:var(--bg); font-size:.9rem; color:var(--muted); }
  .snip.open { display:block; } .meta { color:var(--muted); font-size:.8rem; margin-top:12px; } .nf { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Dastavez</h1>
  <p class="sub">Ask about PM-KISAN, PMAY-U 2.0, PM SVANidhi, Stand-Up India, AB PM-JAY, MGNREGA (Haryana), PM Ujjwala. Every sentence is cited to a page and checked against it.</p>
  <form id="f">
    <input id="q" type="text" placeholder="e.g. What is the minimum carpet area under PMAY-U 2.0?" required minlength="3">
    <select id="mode"><option value="hybrid_rerank">hybrid + rerank</option><option value="hybrid">hybrid</option><option value="lexical">BM25</option><option value="dense">dense</option></select>
    <button>Ask</button>
  </form>
  <div id="out"></div>
</main>
<script>
const out = document.getElementById('out');
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  out.innerHTML = '<div class="answer">Searching...</div>';
  try {
    const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: document.getElementById('q').value, mode: document.getElementById('mode').value})});
    if (!r.ok) { out.innerHTML = '<div class="answer nf">Error ' + r.status + '</div>'; return; }
    const d = await r.json();
    if (d.not_found) { out.innerHTML = '<div class="answer nf">' + esc(d.answer) + '</div>'; return; }
    let html = '<div class="answer">';
    d.sentences.forEach((s, i) => {
      const c = s.citation;
      html += '<p class="s">' + esc(s.text) + ' ' + (c ? '<span class="cite" data-i="' + i + '">[' + esc(c.doc_id) + ' p.' + c.page + ']</span>' : '') + '</p>';
      if (c) html += '<div class="snip" id="sn' + i + '"><strong>' + esc(c.title) + ', page ' + c.page + '</strong><br>' + esc(c.snippet) +
        (c.source_url ? '<br><a href="' + esc(c.source_url) + '#page=' + c.page + '" target="_blank" rel="noopener noreferrer">open source PDF</a>' : '') + '</div>';
    });
    html += '<div class="meta">mode: ' + esc(d.mode) + ' &middot; generator: ' + esc(d.generator) + ' &middot; dropped by verifier: ' + d.dropped.length + '</div></div>';
    out.innerHTML = html;
    out.querySelectorAll('.cite').forEach(el => el.addEventListener('click', () => document.getElementById('sn' + el.dataset.i).classList.toggle('open')));
  } catch (err) { out.innerHTML = '<div class="answer nf">' + esc(err) + '</div>'; }
});
</script>
</body>
</html>
